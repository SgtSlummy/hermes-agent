name: Occult production gate

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/occult/**"
      - "gateway/run.py"
      - "gateway/platforms/api_server.py"
      - "hermes_cli/occult.py"
      - "scripts/install-occult.ps1"
      - "scripts/install-occult.sh"
      - "scripts/occult-install-manifest.json"
      - "scripts/occult-sigstore-requirements.in"
      - "scripts/occult-sigstore-requirements.lock"
      - "scripts/run-occult-launch-canary.py"
      - "scripts/occult_release.py"
      - "tests/agent/occult/**"
      - "tests/gateway/test_occult_runtime_wiring.py"
      - "tests/hermes_cli/test_occult.py"
      - "tests/hermes_cli/test_occult_init.py"
      - "tests/hermes_cli/test_config.py"
      - "docs/occult/**"
      - "README.md"
      - ".github/workflows/occult-production-gate.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "web/**"
      - "ui-tui/**"
      - "website/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:
    inputs:
      version:
        description: Release version recorded in immutable metadata
        required: true
        default: "0.0.0-preview"
        type: string
      channel:
        description: Stable requires production-environment approval and Sigstore
        required: true
        default: preview
        type: choice
        options: [nightly, preview, stable]
      council_ref:
        description: Reviewed Agents Council ref compatible with this release
        required: true
        default: v0.5.2
        type: string
      canary_report_sha256:
        description: SHA-256 of the reviewed redacted local launch canary report
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: occult-production-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: ${{ inputs.channel || 'preview' }}
  RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE_VERSION: ${{ inputs.version || format('pr-{0}', github.event.pull_request.number) }}

jobs:
  platform:
    name: Python package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install pinned development dependencies
        run: uv sync --frozen --extra dev --extra occult
      - name: Verify Occult runtime and release controls
        run: >-
          uv run pytest
          tests/agent/occult
          tests/hermes_cli/test_backup.py
          tests/hermes_cli/test_occult.py
          tests/hermes_cli/test_occult_init.py
          tests/hermes_cli/test_config.py
          tests/gateway/test_occult_runtime_wiring.py
          -q
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""
      - name: Build wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: "0"
        run: uv build --sdist --wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-platform-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  council:
    name: Hermes and Agents Council interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: hermes
      - name: Checkout Agents Council
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SgtSlummy/agents-council
          ref: ${{ inputs.council_ref || 'v0.5.2' }}
          persist-credentials: false
          path: council
      - name: Verify reviewed Council commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_COUNCIL_COMMIT="$(
            jq -r '.council.commit_sha' hermes/scripts/occult-install-manifest.json
          )"
          test "$(git -C council rev-parse HEAD)" = "$EXPECTED_COUNCIL_COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"
      - name: Verify Council
        working-directory: council
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Verify live Hermes-to-Council transport
        working-directory: hermes
        env:
          AGENTS_COUNCIL_ROOT: ${{ github.workspace }}/council
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          uv sync --frozen --extra dev --extra homeassistant
          uv run pytest tests/agent/occult/test_council_transport_e2e.py -q

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check --print-build-logs
      - run: nix build --out-link result --print-build-logs
      - name: Package immutable Nix output
        run: tar --sort=name --mtime="@${SOURCE_DATE_EPOCH:-0}" -chzf nix-package.tar.gz result
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-nix
          path: nix-package.tar.gz
          if-no-files-found: error

  stage:
    name: Assemble immutable release
    needs: [platform, council, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install pinned Python dependencies
        run: uv sync --frozen --extra occult
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hermes-platform-*
          path: compiled/platforms
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-nix
          path: compiled/nix
      - name: Build dashboard, TUI, and documentation
        run: |
          npm ci --prefix web
          (cd web && npm audit --omit=dev --audit-level=critical)
          npm run build --prefix web
          npm ci --prefix ui-tui
          (cd ui-tui && npm audit --omit=dev --audit-level=critical)
          npm run build --prefix ui-tui/packages/hermes-ink
          npm run type-check --prefix ui-tui
          npm test --prefix ui-tui
          npm run build --prefix ui-tui
          npm ci --prefix website
          (cd website && npm audit --omit=dev --audit-level=critical)
          uv run --frozen npm run prebuild --prefix website
          npm run typecheck --prefix website
          npm run build --prefix website
          mkdir -p compiled/dashboard compiled/tui compiled/docs
          cp -R hermes_cli/web_dist/. compiled/dashboard/
          cp ui-tui/dist/entry.js compiled/tui/entry.js
          cp -R website/build/. compiled/docs/
      - name: Build OCI container from pinned source
        run: docker buildx build --output type=oci,dest=compiled/hermes-occult.oci.tar .
      - name: Assemble and verify staged bytes
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export SOURCE_DATE_EPOCH
          uv run --frozen python scripts/occult_release.py assemble \
            --artifacts compiled \
            --output staged \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --channel "$RELEASE_CHANNEL"
          uv run --frozen python scripts/occult_release.py verify staged --allow-unsigned
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: occult-staged-${{ env.RELEASE_COMMIT }}
          path: staged/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  promote:
    name: Sign and promote exact staged bytes
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'stable' &&
      github.ref == 'refs/heads/main'
    needs: stage
    runs-on: ubuntu-latest
    environment: occult-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install pinned Python dependencies
        run: uv sync --frozen --extra occult
      - name: Validate immutable launch inputs
        shell: bash
        env:
          CANARY_REPORT_SHA256: ${{ inputs.canary_report_sha256 }}
          COUNCIL_REF: ${{ inputs.council_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          EXPECTED_COUNCIL_REF="$(
            jq -r '.council.release_tag' scripts/occult-install-manifest.json
          )"
          test "$COUNCIL_REF" = "$EXPECTED_COUNCIL_REF"
          [[ "$CANARY_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          VERSION="${RELEASE_VERSION#v}"
          CANARY="docs/occult/evidence/launch-canary-v${VERSION}.json"
          test -f "$CANARY"
          echo "$CANARY_REPORT_SHA256  $CANARY" | sha256sum -c -
          EXPECTED_MODEL="$(
            jq -r '.ollama_model' scripts/occult-install-manifest.json
          )"
          jq -e \
            --arg model "$EXPECTED_MODEL" \
            '.overall_status == "passed"
             and .contains_secrets == false
             and .release.ollama_model == $model' \
            "$CANARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: occult-staged-${{ env.RELEASE_COMMIT }}
          path: staged
      - name: Sign and cryptographically verify the checksum manifest
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: staged/SHA256SUMS.txt
          verify: true
          verify-cert-identity: >-
            https://github.com/SgtSlummy/hermes-agent/.github/workflows/occult-production-gate.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Verify and promote without rebuilding
        run: |
          uv run --frozen python scripts/occult_release.py verify staged --require-signature
          uv run --frozen python scripts/occult_release.py promote staged promoted
      - name: Create release bundle and checksum
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_VERSION}"
          case "$TAG" in v*) ;; *) TAG="v${TAG}" ;; esac
          BUNDLE="occult-system-${TAG}.tar.gz"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          tar --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -C promoted -cf - . | gzip -n > "$BUNDLE"
          sha256sum "$BUNDLE" > "${BUNDLE}.sha256"
      - name: Sign and verify the release bundle checksum
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: occult-system-*.tar.gz.sha256
          verify: true
          verify-cert-identity: >-
            https://github.com/SgtSlummy/hermes-agent/.github/workflows/occult-production-gate.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Prepare minimal GitHub-first install assets
        shell: bash
        env:
          CANARY_REPORT_SHA256: ${{ inputs.canary_report_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p install-assets
          VERSION="${RELEASE_VERSION#v}"
          CANARY="docs/occult/evidence/launch-canary-v${VERSION}.json"
          CANARY_NAME="$(basename "$CANARY")"
          EXPECTED_COUNCIL_REF="$(
            jq -r '.council.release_tag' scripts/occult-install-manifest.json
          )"
          WHEEL="$(
            find promoted/artifacts/platforms \
              -type f \
              -path '*ubuntu-latest*' \
              -name '*-py3-none-any.whl' \
              -print -quit
          )"
          test -n "$WHEEL"
          WHEEL_NAME="$(basename "$WHEEL")"
          cp "$WHEEL" "install-assets/$WHEEL_NAME"
          cp scripts/install-occult.ps1 install-assets/
          cp scripts/install-occult.sh install-assets/
          cp scripts/occult-install-manifest.json install-assets/
          cp scripts/occult-sigstore-requirements.lock install-assets/
          cp "$CANARY" install-assets/
          uv export \
            --frozen \
            --extra occult \
            --no-dev \
            --no-emit-project \
            --no-header \
            --format requirements-txt \
            --output-file install-assets/occult-requirements.lock
          jq -e \
            --arg version "$VERSION" \
            --arg wheel "$WHEEL_NAME" \
            --arg council "$EXPECTED_COUNCIL_REF" \
            --arg sigstore_lock_sha "$(
              sha256sum scripts/occult-sigstore-requirements.lock | cut -d' ' -f1
            )" \
            '.occult_release_version == $version
             and .hermes_wheel_asset == $wheel
             and .hermes_requirements_asset == "occult-requirements.lock"
             and .sigstore_requirements_asset == "occult-sigstore-requirements.lock"
             and .sigstore_requirements_sha256 == $sigstore_lock_sha
             and .council.release_tag == $council
             and .council.contract_version == "1.0.0"
             and .council.state_schema == 3' \
            install-assets/occult-install-manifest.json
          echo "$CANARY_REPORT_SHA256  install-assets/$CANARY_NAME" |
            sha256sum -c -
          verify_canary_artifact() {
            key="$1"
            file="$2"
            expected_name="$(jq -er --arg key "$key" \
              '.release_artifacts[$key].name' "$CANARY")"
            expected_sha="$(jq -er --arg key "$key" \
              '.release_artifacts[$key].sha256' "$CANARY")"
            test "$(basename "$file")" = "$expected_name"
            echo "$expected_sha  $file" | sha256sum -c -
          }
          verify_canary_artifact \
            install_manifest \
            install-assets/occult-install-manifest.json
          verify_canary_artifact hermes_wheel "install-assets/$WHEEL_NAME"
          verify_canary_artifact \
            hermes_requirements_lock \
            install-assets/occult-requirements.lock
          verify_canary_artifact \
            sigstore_requirements_lock \
            install-assets/occult-sigstore-requirements.lock
          verify_canary_artifact \
            installer_powershell \
            install-assets/install-occult.ps1
          verify_canary_artifact \
            installer_posix \
            install-assets/install-occult.sh
          COUNCIL_ASSET="$(
            jq -r '.council.assets["windows-x64"]' \
              scripts/occult-install-manifest.json
          )"
          mkdir -p "$RUNNER_TEMP/council-canary-artifact"
          gh release download "$EXPECTED_COUNCIL_REF" \
            --repo SgtSlummy/agents-council \
            --pattern "$COUNCIL_ASSET" \
            --dir "$RUNNER_TEMP/council-canary-artifact"
          verify_canary_artifact \
            council_windows_x64 \
            "$RUNNER_TEMP/council-canary-artifact/$COUNCIL_ASSET"
          (
            cd install-assets
            find . -maxdepth 1 -type f \
              ! -name OCCULT-INSTALL-SHA256SUMS.txt \
              -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > OCCULT-INSTALL-SHA256SUMS.txt
          )
      - name: Sign and verify the minimal install checksum manifest
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: install-assets/OCCULT-INSTALL-SHA256SUMS.txt
          verify: true
          verify-cert-identity: >-
            https://github.com/SgtSlummy/hermes-agent/.github/workflows/occult-production-gate.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: occult-stable-${{ env.RELEASE_VERSION }}-${{ env.RELEASE_COMMIT }}
          path: |
            promoted/
            install-assets/
            occult-system-*.tar.gz
            occult-system-*.tar.gz.sha256
            occult-system-*.tar.gz.sha256.sigstore.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_VERSION}"
          case "$TAG" in v*) ;; *) TAG="v${TAG}" ;; esac
          NOTES_VERSION="${TAG#v}"
          NOTES_PATH="docs/occult/release-notes-v${NOTES_VERSION}.md"
          test -f "$NOTES_PATH"
          BUNDLE="occult-system-${TAG}.tar.gz"
          cp "$NOTES_PATH" release-notes.md
          gh release create "$TAG" \
            "$BUNDLE" \
            "${BUNDLE}.sha256" \
            "${BUNDLE}.sha256.sigstore.json" \
            promoted/SHA256SUMS.txt \
            promoted/SHA256SUMS.txt.sigstore.json \
            install-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_COMMIT}" \
            --title "Occult System ${TAG}" \
            --notes-file release-notes.md \
            --latest=false
