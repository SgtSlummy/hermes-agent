name: Tarot Router public canary promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Hermes release verified by the clean-machine canary
        required: true
        default: "1.0.6"
        type: string
      release_commit:
        description: Exact 40-character commit published by the Hermes release gate
        required: true
        type: string
      council_ref:
        description: Signed Agents Council release pinned by Hermes
        required: true
        default: v0.5.5
        type: string
      public_canary_report_sha256:
        description: SHA-256 of the redacted report attached to the Hermes release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tarot-router-public-promotion
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download the already-published release bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}
          COUNCIL_REF: ${{ inputs.council_ref }}
          REPORT_SHA256: ${{ inputs.public_canary_report_sha256 }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_COMMIT="${RELEASE_COMMIT_INPUT}"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COUNCIL_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          TAG="v${VERSION}"
          REPORT="public-launch-canary-v${VERSION}.json"
          EXPECTED_COUNCIL="$(
            jq -r '.council.release_tag' scripts/occult-install-manifest.json
          )"
          EXPECTED_COUNCIL_COMMIT="$(
            jq -r '.council.commit_sha' scripts/occult-install-manifest.json
          )"
          EXPECTED_HERMES_CLI="$(
            jq -r '.hermes_cli_version' scripts/occult-install-manifest.json
          )"
          EXPECTED_CONTRACT="$(
            jq -r '.council.contract_version' scripts/occult-install-manifest.json
          )"
          EXPECTED_COUNCIL_STATE_SCHEMA="$(
            jq -r '.council.state_schema' scripts/occult-install-manifest.json
          )"
          EXPECTED_OLLAMA_MODEL="$(
            jq -r '.ollama_model' scripts/occult-install-manifest.json
          )"
          test "$COUNCIL_REF" = "$EXPECTED_COUNCIL"
          RESOLVED_COUNCIL_COMMIT="$(
            gh api "repos/SgtSlummy/agents-council/commits/$COUNCIL_REF" \
              --jq .sha
          )"
          test "$RESOLVED_COUNCIL_COMMIT" = "$EXPECTED_COUNCIL_COMMIT"
          mkdir -p public-assets council-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public-assets
          gh release download "$COUNCIL_REF" \
            --repo SgtSlummy/agents-council \
            --dir council-assets
          test -f "public-assets/$REPORT"
          echo "$REPORT_SHA256  public-assets/$REPORT" | sha256sum -c -
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RELEASE_COMMIT"
          jq -r '.assets[] | [.name, .digest] | @tsv' <<<"$RELEASE_JSON" |
            while IFS=$'\t' read -r name digest; do
              test -f "public-assets/$name"
              test "$digest" = "sha256:$(sha256sum "public-assets/$name" | cut -d' ' -f1)"
            done
          jq -e \
            --arg hermes "$TAG" \
            --arg council "${COUNCIL_REF#v}" \
            --arg hermes_cli "$EXPECTED_HERMES_CLI" \
            --arg council_commit "$EXPECTED_COUNCIL_COMMIT" \
            --arg contract "$EXPECTED_CONTRACT" \
            --argjson council_state "$EXPECTED_COUNCIL_STATE_SCHEMA" \
            --arg model "$EXPECTED_OLLAMA_MODEL" \
            '.schema_version == "1.0.0"
             and .scope == "public Windows x64 launch canary"
             and .platform == {"os":"Windows","architecture":"x86_64"}
             and .candidate_status == "passed"
             and .overall_status == "passed"
             and .promotion_eligible == true
             and .checks.installer_idempotent_rerun == "passed"
             and .checks.installer_tamper_repair == "passed"
             and .contains_secrets == false
             and .release.hermes == $hermes
             and .release.hermes_cli == $hermes_cli
             and .release.agents_council == $council
             and .release.council_commit == $council_commit
             and .release.runtime_contract == $contract
             and .release.council_state_schema == $council_state
             and .release.ollama_model == $model' \
            "public-assets/$REPORT"
          EXPECTED_CHECK_KEYS='["audit_redaction","backup_restore","candidate_artifact_installation","council_pause_restart_resume","council_source_provenance","default_model_binding","disabled_before_initialization","explicit_local_initialization","gateway_restart","installer_idempotent_rerun","installer_interface","installer_tamper_repair","packaged_council_mcp_flow","rollback_previous_checksummed_releases","temporary_secret_cleanup","versions","zero_cost_major_arcana_invocation"]'
          jq -e \
            --argjson expected "$EXPECTED_CHECK_KEYS" \
            '(.checks | type == "object")
             and ((.checks | keys) == $expected)
             and ([.checks[] | . == "passed"] | all)' \
            "public-assets/$REPORT"
          EXPECTED_ARTIFACT_NAMES="$(
            jq -c '{
              install_manifest: "occult-install-manifest.json",
              hermes_wheel: .hermes_wheel_asset,
              hermes_requirements_lock: .hermes_requirements_asset,
              sigstore_requirements_lock: .sigstore_requirements_asset,
              installer_powershell: "install-occult.ps1",
              installer_posix: "install-occult.sh",
              environment_verifier: .environment_verifier_asset,
              council_windows_x64: .council.assets["windows-x64"]
            }' scripts/occult-install-manifest.json
          )"
          jq -e \
            --argjson expected "$EXPECTED_ARTIFACT_NAMES" \
            '(.release_artifacts | type == "object")
             and ((.release_artifacts
                   | with_entries(.value = .value.name)) == $expected)' \
            "public-assets/$REPORT"
          jq -r '.release_artifacts | to_entries[] | [.key, .value.name, .value.sha256] | @tsv' \
            "public-assets/$REPORT" |
            while IFS=$'\t' read -r key name expected; do
              case "$key" in
                council_windows_x64) path="council-assets/$name" ;;
                *) path="public-assets/$name" ;;
              esac
              test -f "$path"
              echo "$expected  $path" | sha256sum -c -
            done
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "COUNCIL_REF=$COUNCIL_REF" >> "$GITHUB_ENV"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
      - name: Verify Sigstore identities and signed checksum manifests offline
        shell: bash
        run: |
          set -euo pipefail
          uv venv --no-config --python 3.11 "$RUNNER_TEMP/sigstore-verifier"
          uv pip sync \
            --no-config \
            --python "$RUNNER_TEMP/sigstore-verifier/bin/python" \
            --require-hashes \
            public-assets/occult-sigstore-requirements.lock
          SIGSTORE="$RUNNER_TEMP/sigstore-verifier/bin/sigstore"
          HERMES_IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/occult-production-gate.yml@refs/heads/main"
          COUNCIL_IDENTITY="https://github.com/SgtSlummy/agents-council/.github/workflows/release.yml@refs/tags/$COUNCIL_REF"
          ISSUER="https://token.actions.githubusercontent.com"
          verify_identity() {
            subject=$1
            bundle=$2
            identity=$3
            "$SIGSTORE" verify identity \
              --bundle "$bundle" \
              --cert-identity "$identity" \
              --cert-oidc-issuer "$ISSUER" \
              --offline \
              "$subject"
          }
          verify_identity \
            public-assets/OCCULT-INSTALL-SHA256SUMS.txt \
            public-assets/OCCULT-INSTALL-SHA256SUMS.txt.sigstore.json \
            "$HERMES_IDENTITY"
          verify_identity \
            public-assets/SHA256SUMS.txt \
            public-assets/SHA256SUMS.txt.sigstore.json \
            "$HERMES_IDENTITY"
          verify_identity \
            "public-assets/occult-system-${TAG}.tar.gz.sha256" \
            "public-assets/occult-system-${TAG}.tar.gz.sha256.sigstore.json" \
            "$HERMES_IDENTITY"
          verify_identity \
            council-assets/RELEASE-SHA256SUMS.txt \
            council-assets/RELEASE-SHA256SUMS.txt.sigstore.json \
            "$COUNCIL_IDENTITY"
          (
            cd public-assets
            sha256sum -c OCCULT-INSTALL-SHA256SUMS.txt
            sha256sum -c "occult-system-${TAG}.tar.gz.sha256"
          )
          COUNCIL_ASSET="$(
            jq -r '.council.assets["windows-x64"]' scripts/occult-install-manifest.json
          )"
          (
            cd council-assets
            grep -F "  $COUNCIL_ASSET" RELEASE-SHA256SUMS.txt | sha256sum -c -
          )
      - name: Verify the signed release bundle contents
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="public-assets/occult-system-${TAG}.tar.gz"
          mkdir -p "$RUNNER_TEMP/release-bundle"
          tar -tzf "$BUNDLE" | while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..) exit 1 ;;
            esac
          done
          tar -xzf "$BUNDLE" -C "$RUNNER_TEMP/release-bundle"
          (
            cd "$RUNNER_TEMP/release-bundle"
            sha256sum -c SHA256SUMS.txt
          )

  verify-posix:
    name: Signed POSIX installer (${{ matrix.platform }}-${{ matrix.architecture }})
    needs: verify-release
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
            system: Linux
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            system: Linux
            machine: aarch64
          - runner: macos-15-intel
            platform: darwin
            architecture: x64
            system: Darwin
            machine: x86_64
          - runner: macos-15
            platform: darwin
            architecture: arm64
            system: Darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Authenticate the exact POSIX installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_COMMIT="$RELEASE_COMMIT_INPUT"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(uname -s)" = "$EXPECTED_SYSTEM"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          TAG="v${VERSION}"
          mkdir -p public-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir public-assets \
            --pattern install-occult.sh \
            --pattern OCCULT-INSTALL-SHA256SUMS.txt \
            --pattern OCCULT-INSTALL-SHA256SUMS.txt.sigstore.json
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RELEASE_COMMIT"
          jq -r '.assets[] | [.name, .digest] | @tsv' <<<"$RELEASE_JSON" |
            while IFS=$'\t' read -r name digest; do
              if test -f "public-assets/$name"; then
                actual="$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "public-assets/$name")"
                test "$digest" = "sha256:$actual"
              fi
            done
          uv venv --no-config --python 3.11 "$RUNNER_TEMP/sigstore-verifier"
          uv pip sync \
            --no-config \
            --python "$RUNNER_TEMP/sigstore-verifier/bin/python" \
            --require-hashes \
            scripts/occult-sigstore-requirements.lock
          "$RUNNER_TEMP/sigstore-verifier/bin/sigstore" verify identity \
            --bundle public-assets/OCCULT-INSTALL-SHA256SUMS.txt.sigstore.json \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/occult-production-gate.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --offline \
            public-assets/OCCULT-INSTALL-SHA256SUMS.txt
          expected="$(awk '$2 == "install-occult.sh" {print $1}' public-assets/OCCULT-INSTALL-SHA256SUMS.txt)"
          test -n "$expected"
          actual="$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' public-assets/install-occult.sh)"
          test "$actual" = "$expected"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Exercise signed POSIX installer reuse, repair, and skip transition
        shell: bash
        env:
          HOME: ${{ runner.temp }}/tarot-posix-home
          XDG_BIN_HOME: ${{ runner.temp }}/tarot-posix-bin
          HERMES_HOME: ${{ runner.temp }}/tarot-posix-hermes-home
        run: |
          set -euo pipefail
          INSTALLER="$PWD/public-assets/install-occult.sh"
          INSTALL_ROOT="$RUNNER_TEMP/tarot-posix-install"
          RECEIPT="$INSTALL_ROOT/occult-install-receipt.json"
          HERMES_COMMAND="$INSTALL_ROOT/bin/hermes"
          COUNCIL_COMMAND="$INSTALL_ROOT/bin/council"
          VERSION="${TAG#v}"
          mkdir -p "$HOME" "$XDG_BIN_HOME" "$HERMES_HOME"
          run_installer() {
            sh "$INSTALLER" --version "$VERSION" --install-root "$INSTALL_ROOT"
          }
          run_skip_installer() {
            sh "$INSTALLER" --version "$VERSION" \
              --install-root "$INSTALL_ROOT" --skip-council
          }
          hash_file() {
            shasum -a 256 "$1" | awk '{print $1}'
          }
          receipt_hash() {
            hash_file "$RECEIPT"
          }
          receipt_mtime() {
            python -c 'import os,sys; print(os.stat(sys.argv[1]).st_mtime_ns)' "$RECEIPT"
          }
          real_path() {
            python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve())' "$1"
          }
          hermes_module() {
            environment_name=$(jq -er '.hermes_environment' "$RECEIPT")
            find "$INSTALL_ROOT/hermes-environments/$environment_name" \
              -path '*/site-packages/hermes_cli/__init__.py' \
              -type f -print -quit
          }
          packaged_council() {
            environment_name=$(jq -er '.council_environment' "$RECEIPT")
            printf '%s/council-environments/%s/cli/council\n' \
              "$INSTALL_ROOT" "$environment_name"
          }

          run_installer
          jq -e \
            '.occult_initialized == false and .occult_enabled == false' \
            "$RECEIPT"
          first_receipt_hash=$(receipt_hash)
          first_receipt_mtime=$(receipt_mtime)
          first_hermes_environment=$(jq -er '.hermes_environment' "$RECEIPT")
          first_council_environment=$(jq -er '.council_environment' "$RECEIPT")
          first_hermes_module=$(hermes_module)
          first_packaged_council=$(packaged_council)
          test -f "$first_hermes_module"
          test -x "$first_packaged_council"
          first_hermes_module_hash=$(hash_file "$first_hermes_module")
          first_council_hash=$(hash_file "$COUNCIL_COMMAND")
          test "$first_council_hash" = "$(hash_file "$first_packaged_council")"

          sleep 1
          run_installer
          test "$(receipt_hash)" = "$first_receipt_hash"
          test "$(receipt_mtime)" = "$first_receipt_mtime"
          test "$(jq -er '.hermes_environment' "$RECEIPT")" = "$first_hermes_environment"
          test "$(jq -er '.council_environment' "$RECEIPT")" = "$first_council_environment"

          printf '\n# tampered by protected POSIX canary\n' >> "$first_hermes_module"
          printf '\n# tampered by protected POSIX canary\n' >> "$COUNCIL_COMMAND"
          printf '\n# tampered by protected POSIX canary\n' >> "$first_packaged_council"
          run_installer
          jq -e \
            '.occult_initialized == false and .occult_enabled == false' \
            "$RECEIPT"
          repaired_hermes_environment=$(jq -er '.hermes_environment' "$RECEIPT")
          repaired_council_environment=$(jq -er '.council_environment' "$RECEIPT")
          test "$repaired_hermes_environment" != "$first_hermes_environment"
          test "$repaired_council_environment" != "$first_council_environment"
          repaired_hermes_module=$(hermes_module)
          repaired_packaged_council=$(packaged_council)
          test "$(hash_file "$repaired_hermes_module")" = "$first_hermes_module_hash"
          test "$(hash_file "$COUNCIL_COMMAND")" = "$first_council_hash"
          test "$(hash_file "$repaired_packaged_council")" = "$first_council_hash"

          repaired_receipt_hash=$(receipt_hash)
          repaired_receipt_mtime=$(receipt_mtime)
          repaired_hermes_target=$(real_path "$HERMES_COMMAND")
          sleep 1
          run_installer
          test "$(receipt_hash)" = "$repaired_receipt_hash"
          test "$(receipt_mtime)" = "$repaired_receipt_mtime"
          test "$(real_path "$HERMES_COMMAND")" = "$repaired_hermes_target"
          test "$(hash_file "$COUNCIL_COMMAND")" = "$first_council_hash"

          run_skip_installer
          test ! -e "$COUNCIL_COMMAND"
          test ! -L "$COUNCIL_COMMAND"
          test ! -L "$XDG_BIN_HOME/council"
          jq -e \
            '.council_release == null
             and .council_archive_sha256 == null
             and .council_environment == null
             and .occult_initialized == false
             and .occult_enabled == false' \
            "$RECEIPT"
          skip_receipt_hash=$(receipt_hash)
          skip_receipt_mtime=$(receipt_mtime)
          skip_hermes_target=$(real_path "$HERMES_COMMAND")
          sleep 1
          run_skip_installer
          test ! -e "$COUNCIL_COMMAND"
          test ! -L "$COUNCIL_COMMAND"
          test ! -L "$XDG_BIN_HOME/council"
          test "$(receipt_hash)" = "$skip_receipt_hash"
          test "$(receipt_mtime)" = "$skip_receipt_mtime"
          test "$(real_path "$HERMES_COMMAND")" = "$skip_hermes_target"

  promote-latest:
    needs: [verify-release, verify-posix]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: occult-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Revalidate current release bytes and promote Hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          COUNCIL_REF: ${{ inputs.council_ref }}
          REPORT_SHA256: ${{ inputs.public_canary_report_sha256 }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COUNCIL_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          TAG="v${VERSION}"
          REPORT="public-launch-canary-v${VERSION}.json"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          EXPECTED_COUNCIL="$(
            jq -r '.council.release_tag' scripts/occult-install-manifest.json
          )"
          EXPECTED_COUNCIL_COMMIT="$(
            jq -r '.council.commit_sha' scripts/occult-install-manifest.json
          )"
          EXPECTED_HERMES_CLI="$(
            jq -r '.hermes_cli_version' scripts/occult-install-manifest.json
          )"
          EXPECTED_CONTRACT="$(
            jq -r '.council.contract_version' scripts/occult-install-manifest.json
          )"
          EXPECTED_COUNCIL_STATE_SCHEMA="$(
            jq -r '.council.state_schema' scripts/occult-install-manifest.json
          )"
          EXPECTED_OLLAMA_MODEL="$(
            jq -r '.ollama_model' scripts/occult-install-manifest.json
          )"
          test "$COUNCIL_REF" = "$EXPECTED_COUNCIL"
          test "$(
            gh api "repos/SgtSlummy/agents-council/commits/$COUNCIL_REF" --jq .sha
          )" = "$EXPECTED_COUNCIL_COMMIT"
          test "$(gh release view --repo SgtSlummy/agents-council --json tagName --jq .tagName)" = "$COUNCIL_REF"

          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"' EXIT
          PUBLIC="$WORK/public-assets"
          COUNCIL="$WORK/council-assets"
          mkdir -p "$PUBLIC" "$COUNCIL"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$PUBLIC"
          gh release download "$COUNCIL_REF" \
            --repo SgtSlummy/agents-council \
            --dir "$COUNCIL"

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          COUNCIL_JSON="$(
            gh api "repos/SgtSlummy/agents-council/releases/tags/$COUNCIL_REF"
          )"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "$RELEASE_COMMIT"
          RELEASE_ASSET_SNAPSHOT="$(
            jq -c '[.assets[] | {id,name,digest,size,updated_at}] | sort_by(.name)' \
              <<<"$RELEASE_JSON"
          )"
          RELEASE_STATE_SNAPSHOT="$(
            jq -c '{id,tag_name,target_commitish,draft,prerelease}' \
              <<<"$RELEASE_JSON"
          )"
          COUNCIL_ASSET_SNAPSHOT="$(
            jq -c '[.assets[] | {id,name,digest,size,updated_at}] | sort_by(.name)' \
              <<<"$COUNCIL_JSON"
          )"
          COUNCIL_STATE_SNAPSHOT="$(
            jq -c '{id,tag_name,target_commitish,draft,prerelease}' \
              <<<"$COUNCIL_JSON"
          )"
          jq -r '.assets[] | [.name, .digest] | @tsv' <<<"$RELEASE_JSON" |
            while IFS=$'\t' read -r name digest; do
              test -f "$PUBLIC/$name"
              test "$digest" = "sha256:$(sha256sum "$PUBLIC/$name" | cut -d' ' -f1)"
            done
          jq -r '.assets[] | [.name, .digest] | @tsv' <<<"$COUNCIL_JSON" |
            while IFS=$'\t' read -r name digest; do
              test -f "$COUNCIL/$name"
              test "$digest" = "sha256:$(sha256sum "$COUNCIL/$name" | cut -d' ' -f1)"
            done

          test -f "$PUBLIC/$REPORT"
          echo "$REPORT_SHA256  $PUBLIC/$REPORT" | sha256sum -c -
          jq -e \
            --arg hermes "$TAG" \
            --arg council "${COUNCIL_REF#v}" \
            --arg hermes_cli "$EXPECTED_HERMES_CLI" \
            --arg council_commit "$EXPECTED_COUNCIL_COMMIT" \
            --arg contract "$EXPECTED_CONTRACT" \
            --argjson council_state "$EXPECTED_COUNCIL_STATE_SCHEMA" \
            --arg model "$EXPECTED_OLLAMA_MODEL" \
            '.schema_version == "1.0.0"
             and .scope == "public Windows x64 launch canary"
             and .platform == {"os":"Windows","architecture":"x86_64"}
             and .candidate_status == "passed"
             and .overall_status == "passed"
             and .promotion_eligible == true
             and .checks.installer_idempotent_rerun == "passed"
             and .checks.installer_tamper_repair == "passed"
             and .contains_secrets == false
             and .release.hermes == $hermes
             and .release.hermes_cli == $hermes_cli
             and .release.agents_council == $council
             and .release.council_commit == $council_commit
             and .release.runtime_contract == $contract
             and .release.council_state_schema == $council_state
             and .release.ollama_model == $model' \
            "$PUBLIC/$REPORT"
          EXPECTED_CHECK_KEYS='["audit_redaction","backup_restore","candidate_artifact_installation","council_pause_restart_resume","council_source_provenance","default_model_binding","disabled_before_initialization","explicit_local_initialization","gateway_restart","installer_idempotent_rerun","installer_interface","installer_tamper_repair","packaged_council_mcp_flow","rollback_previous_checksummed_releases","temporary_secret_cleanup","versions","zero_cost_major_arcana_invocation"]'
          jq -e \
            --argjson expected "$EXPECTED_CHECK_KEYS" \
            '(.checks | type == "object")
             and ((.checks | keys) == $expected)
             and ([.checks[] | . == "passed"] | all)' \
            "$PUBLIC/$REPORT"
          EXPECTED_ARTIFACT_NAMES="$(
            jq -c '{
              install_manifest: "occult-install-manifest.json",
              hermes_wheel: .hermes_wheel_asset,
              hermes_requirements_lock: .hermes_requirements_asset,
              sigstore_requirements_lock: .sigstore_requirements_asset,
              installer_powershell: "install-occult.ps1",
              installer_posix: "install-occult.sh",
              environment_verifier: .environment_verifier_asset,
              council_windows_x64: .council.assets["windows-x64"]
            }' scripts/occult-install-manifest.json
          )"
          jq -e \
            --argjson expected "$EXPECTED_ARTIFACT_NAMES" \
            '(.release_artifacts | type == "object")
             and ((.release_artifacts
                   | with_entries(.value = .value.name)) == $expected)' \
            "$PUBLIC/$REPORT"
          jq -r '.release_artifacts | to_entries[] | [.key, .value.name, .value.sha256] | @tsv' \
            "$PUBLIC/$REPORT" |
            while IFS=$'\t' read -r key name expected; do
              case "$key" in
                council_windows_x64) path="$COUNCIL/$name" ;;
                *) path="$PUBLIC/$name" ;;
              esac
              test -f "$path"
              echo "$expected  $path" | sha256sum -c -
            done

          uv venv --no-config --python 3.11 "$WORK/sigstore-verifier"
          uv pip sync \
            --no-config \
            --python "$WORK/sigstore-verifier/bin/python" \
            --require-hashes \
            "$PUBLIC/occult-sigstore-requirements.lock"
          SIGSTORE="$WORK/sigstore-verifier/bin/sigstore"
          HERMES_IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/occult-production-gate.yml@refs/heads/main"
          COUNCIL_IDENTITY="https://github.com/SgtSlummy/agents-council/.github/workflows/release.yml@refs/tags/$COUNCIL_REF"
          ISSUER="https://token.actions.githubusercontent.com"
          verify_identity() {
            subject=$1
            bundle=$2
            identity=$3
            "$SIGSTORE" verify identity \
              --bundle "$bundle" \
              --cert-identity "$identity" \
              --cert-oidc-issuer "$ISSUER" \
              --offline \
              "$subject"
          }
          verify_identity \
            "$PUBLIC/OCCULT-INSTALL-SHA256SUMS.txt" \
            "$PUBLIC/OCCULT-INSTALL-SHA256SUMS.txt.sigstore.json" \
            "$HERMES_IDENTITY"
          verify_identity \
            "$PUBLIC/SHA256SUMS.txt" \
            "$PUBLIC/SHA256SUMS.txt.sigstore.json" \
            "$HERMES_IDENTITY"
          verify_identity \
            "$PUBLIC/occult-system-${TAG}.tar.gz.sha256" \
            "$PUBLIC/occult-system-${TAG}.tar.gz.sha256.sigstore.json" \
            "$HERMES_IDENTITY"
          verify_identity \
            "$COUNCIL/RELEASE-SHA256SUMS.txt" \
            "$COUNCIL/RELEASE-SHA256SUMS.txt.sigstore.json" \
            "$COUNCIL_IDENTITY"
          (
            cd "$PUBLIC"
            sha256sum -c OCCULT-INSTALL-SHA256SUMS.txt
            sha256sum -c "occult-system-${TAG}.tar.gz.sha256"
          )
          COUNCIL_ASSET="$(
            jq -r '.council.assets["windows-x64"]' \
              scripts/occult-install-manifest.json
          )"
          (
            cd "$COUNCIL"
            grep -F "  $COUNCIL_ASSET" RELEASE-SHA256SUMS.txt | sha256sum -c -
          )
          BUNDLE="$PUBLIC/occult-system-${TAG}.tar.gz"
          mkdir -p "$WORK/release-bundle"
          tar -tzf "$BUNDLE" | while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..) exit 1 ;;
            esac
          done
          tar -xzf "$BUNDLE" -C "$WORK/release-bundle"
          (cd "$WORK/release-bundle" && sha256sum -c SHA256SUMS.txt)

          CURRENT_RELEASE_SNAPSHOT="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" |
              jq -c '[.assets[] | {id,name,digest,size,updated_at}] | sort_by(.name)'
          )"
          CURRENT_RELEASE_STATE="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" |
              jq -c '{id,tag_name,target_commitish,draft,prerelease}'
          )"
          CURRENT_COUNCIL_SNAPSHOT="$(
            gh api "repos/SgtSlummy/agents-council/releases/tags/$COUNCIL_REF" |
              jq -c '[.assets[] | {id,name,digest,size,updated_at}] | sort_by(.name)'
          )"
          CURRENT_COUNCIL_STATE="$(
            gh api "repos/SgtSlummy/agents-council/releases/tags/$COUNCIL_REF" |
              jq -c '{id,tag_name,target_commitish,draft,prerelease}'
          )"
          test "$CURRENT_RELEASE_SNAPSHOT" = "$RELEASE_ASSET_SNAPSHOT"
          test "$CURRENT_RELEASE_STATE" = "$RELEASE_STATE_SNAPSHOT"
          test "$CURRENT_COUNCIL_SNAPSHOT" = "$COUNCIL_ASSET_SNAPSHOT"
          test "$CURRENT_COUNCIL_STATE" = "$COUNCIL_STATE_SNAPSHOT"
          test "$(
            gh api "repos/SgtSlummy/agents-council/commits/$COUNCIL_REF" --jq .sha
          )" = "$EXPECTED_COUNCIL_COMMIT"
          test "$(
            gh release view --repo SgtSlummy/agents-council --json tagName --jq .tagName
          )" = "$COUNCIL_REF"
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --latest
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$TAG"
